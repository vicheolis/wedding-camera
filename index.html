<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kenangan Majlis</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#452B48;color:#E8E0E0;font-family:'Cormorant Garamond',serif}
.script{font-family:'Great Vibes',cursive;font-weight:400}
.s{display:none;position:fixed;inset:0;height:100dvh;flex-direction:column;align-items:center;padding:18px 16px;background:radial-gradient(circle at 50% 20%,#7F4F6A,#452B48 80%);overflow:auto}
.s.on{display:flex}
.s>*{flex-shrink:0}
h1{font-size:62px;margin:8px 0;text-align:center;line-height:1.05;color:#F2D7DD}
.btn{width:100%;max-width:420px;padding:15px;border-radius:30px;border:2px solid #C08E92;background:#E8E0E0;color:#452B48;font:600 16px 'Cormorant Garamond',serif;letter-spacing:3px;text-transform:uppercase}
.btn.o{background:transparent;color:#F2D7DD}
input{width:100%;max-width:420px;padding:14px;border-radius:12px;border:1px solid #B5A9B5;background:rgba(255,255,255,.1);color:#fff;font-size:17px;margin:6px 0 14px}
.hdr{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:460px}
.ic{width:44px;height:44px;border-radius:50%;border:1px solid #B5A9B5;background:rgba(255,255,255,.1);color:#E8E0E0;font-size:20px}
canvas{width:auto;height:auto;max-width:100%;max-height:max(300px,calc(100dvh - 255px));border-radius:12px;margin:8px 0}
.row{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:4px}
.chip{flex:none;padding:6px 14px;border-radius:20px;border:1px solid #B5A9B5;background:transparent;color:#E8E0E0;font:500 15px 'Cormorant Garamond',serif}
.chip.on{background:#E8E0E0;color:#452B48}
.sw{flex:none;width:56px;background:none;border:0;color:#E8E0E0;font:500 12px 'Cormorant Garamond',serif;white-space:nowrap;padding:0;text-align:center}
.sw i{display:block;width:42px;height:42px;border-radius:50%;margin:0 auto 3px;border:2px solid #B5A9B5}
.sw.on i{border-color:#E8E0E0;box-shadow:0 0 0 2px #C08E92}
#filters{gap:2px;justify-content:center}
.ctl{display:flex;align-items:center;justify-content:space-around;width:100%;max-width:420px;margin-top:10px}
#shut{width:78px;height:78px;border-radius:50%;border:5px solid #C08E92;background:#E8E0E0}
#vid{position:absolute;width:2px;height:2px;opacity:.01;pointer-events:none;left:0;top:0}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:460px;margin:14px 0}
.card{background:#E8E0E0;padding:8px 8px 4px;border-radius:4px;color:#452B48;text-align:center;transform:rotate(-1.5deg)}
.card:nth-child(even){transform:rotate(1.5deg)}
.card img{width:100%;display:block}
#res{position:fixed;inset:0;background:rgba(30,16,32,.93);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9}
#res.on{display:flex}#res img{max-width:80%;max-height:65%;border-radius:8px}
#res a{color:#F2D7DD;font-size:20px}
</style>
</head>
<body>
<video id="vid" autoplay playsinline muted></video>

<section id="home" class="s on">
  <div style="margin-top:6vh;text-align:center">
    <div style="letter-spacing:4px;text-transform:uppercase;font-size:14px">Walimatulurus</div>
    <h1 class="script" id="nm1"></h1>
    <div id="dt" style="font-size:20px"></div>
    <div id="tg" style="color:#F2D7DD;margin-top:6px"></div>
  </div>
  <div style="flex:1"></div>
  <div style="width:100%;max-width:420px"><i>Nama Anda</i></div>
  <input id="guest" placeholder="Nama Anda">
  <button class="btn" onclick="openCam()">&#128247; Ambil Gambar</button>
  <button class="btn o" style="margin-top:10px" onclick="show('album')">Lihat Album Kenangan</button>
</section>

<section id="cam" class="s">
  <div class="hdr"><button class="ic" onclick="closeCam()">&#10005;</button><div class="script" id="nm2" style="font-size:36px;color:#F2D7DD"></div><button class="ic" onclick="flip()">&#8635;</button></div>
  <canvas id="c" width="720" height="960"></canvas>
  <div class="row" id="frames"></div>
  <div class="row" id="filters"></div>
  <div class="ctl">
    <button class="ic" style="width:56px;height:56px" onclick="document.getElementById('pick').click()">&#128444;</button>
    <button id="shut" onclick="snap()"></button>
    <div style="width:56px"></div>
  </div>
  <input type="file" id="pick" accept="image/*" hidden>
</section>

<section id="album" class="s">
  <div class="hdr"><button class="ic" onclick="show('home')">&#8249;</button><div class="script" style="font-size:36px;color:#F2D7DD">Album Kenangan</div><button class="ic" onclick="renderAlbum()">&#8635;</button></div>
  <div id="grid"></div>
  <div style="flex:1"></div>
  <button class="btn" onclick="openCam()">&#128247; Ambil Gambar</button>
</section>

<div id="res"><img id="rimg"><a id="dl" download="kenangan.jpg">Simpan ke telefon</a><button class="btn o" style="max-width:200px" onclick="res.classList.remove('on')">Tutup</button></div>

<script>
// ===== EDIT THIS =====
const CFG={groom:"Firdaus",bride:"Aleeya",date:"Disember 2026",tag:"#FirdausDanAleeya"};
// =====================
const NAMES=CFG.groom+" & "+CFG.bride;
const $=id=>document.getElementById(id);
$('nm1').textContent=NAMES;$('nm2').textContent=NAMES;$('dt').textContent=CFG.date;$('tg').textContent=CFG.tag;
const cam=$('cam'),c=$('c'),ctx=c.getContext('2d'),v=$('vid'),res=$('res');
const W=720,H=960;
let stream,facing='user',frame='Oval',filt='Asli',still=null,photos=[];

function show(id){document.querySelectorAll('.s').forEach(s=>s.classList.toggle('on',s.id===id));if(id==='album')renderAlbum()}

// ----- drawing helpers
function txt(s,y,size,col,font){ctx.textAlign='center';ctx.fillStyle=col;ctx.font=size+"px "+font;ctx.fillText(s,360,y)}
function gold(){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#F5DFE3');g.addColorStop(.5,'#B9818A');g.addColorStop(1,'#F5DFE3');return g}
const SC="'Great Vibes',cursive",SF="'Cormorant Garamond',serif";

// ----- FRAMES. Oval/Renda use PNG files (frame + a mask of the photo window). Replace the PNGs to change the look.
function pic(src){const i=new Image();i.src=src;return i}
const FRAMES={
 Oval:{img:pic('frame-oval.png'),mask:pic('mask-oval.png'),x:60,y:10,w:600,h:818,box:[158,127,404,581],
  deco(){txt(NAMES,892,66,'#E8E0E0',SC);txt(CFG.date,937,24,'#F2D7DD',SF)}},
 Renda:{img:pic('frame-lace.png'),mask:pic('mask-lace.png'),x:30,y:12,w:660,h:835,box:[116,98,488,663],
  deco(){txt(NAMES,906,58,'#E8E0E0',SC);txt(CFG.date,942,22,'#F2D7DD',SF)}},
 Polaroid:{box:[70,70,580,640],path:()=>{ctx.beginPath();ctx.rect(70,70,580,640)},
  bg(){ctx.fillStyle='#E8E0E0';ctx.fillRect(40,40,640,880)},
  deco(){txt(NAMES,820,70,'#452B48',SC);txt(CFG.date,870,26,'#7F4F6A',SF)}},
 Asli:{box:[0,0,W,H],path:()=>{ctx.beginPath();ctx.rect(0,0,W,H)},
  deco(){const g=ctx.createLinearGradient(0,800,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.6)');ctx.fillStyle=g;ctx.fillRect(0,800,W,160);txt(NAMES,920,62,'#fff',SC)}}
};
// ----- FILM LOOKS: tone curves + split toning + saturation + grain + vignette
// c=contrast b=brightness f=faded blacks sh/hi=[r,g,b] tint in shadows/highlights sat=saturation
const LOOKS={
 Asli:null,
 Kromo:{c:1.15,b:-.02,f:.03,sh:[-.02,.01,.035],hi:[.02,.01,-.015],sat:.72,grain:.03,vig:.25},
 Filem:{c:1.1,b:0,f:.05,sh:[0,.015,.03],hi:[.04,.02,-.03],sat:.95,grain:.06,vig:.2},
 Segar:{c:1.05,b:.06,f:0,sh:[0,.01,.02],hi:[.01,.01,0],sat:1.2,grain:0,vig:0},
 Lembut:{c:.92,b:.08,f:.08,sh:[.03,0,.03],hi:[.03,.01,.02],sat:.9,grain:.015,vig:.1},
 'Hitam Putih':{c:1.25,b:0,f:.02,sh:[0,0,0],hi:[0,0,0],sat:0,grain:.05,vig:.3}
};
function lut(L){if(L._l)return L._l;const t=[0,1,2].map(ch=>{const a=new Uint8ClampedArray(256);
 for(let x=0;x<256;x++){let y=(x/255-.5)*L.c+.5+L.b;y=y<0?0:y>1?1:y;y=L.f+y*(1-L.f);y+=L.sh[ch]*(1-y)*(1-y)+L.hi[ch]*y*y;a[x]=y*255}return a});return L._l=t}
const oc=document.createElement('canvas'),octx=oc.getContext('2d',{willReadFrequently:true});
let FULL=false;
function grade(L,w,h){
 const im=octx.getImageData(0,0,w,h),d=im.data,[A,B,C]=lut(L),s=L.sat,gr=L.grain*255;
 for(let i=0;i<d.length;i+=4){let r=A[d[i]],g=B[d[i+1]],b=C[d[i+2]];const l=.299*r+.587*g+.114*b;
  r=l+(r-l)*s;g=l+(g-l)*s;b=l+(b-l)*s;if(gr){const n=(Math.random()-.5)*gr;r+=n;g+=n;b+=n}d[i]=r;d[i+1]=g;d[i+2]=b}
 octx.putImageData(im,0,0)}

function chips(id,obj,get,set){const b=$(id);Object.keys(obj).forEach(k=>{const e=document.createElement('button');e.className='chip'+(k===get()?' on':'');e.textContent=k;
 e.onclick=()=>{set(k);[...b.children].forEach(x=>x.classList.toggle('on',x===e))};b.appendChild(e)})}
chips('frames',FRAMES,()=>frame,k=>frame=k);const SWC={Asli:'linear-gradient(135deg,#fff,#cdbfa6)',Kromo:'linear-gradient(135deg,#7d8f93,#3f4a52)',Filem:'linear-gradient(135deg,#e3b98a,#6f7f86)',Segar:'linear-gradient(135deg,#9fe0ff,#ffd27a)',Lembut:'linear-gradient(135deg,#ffe3ec,#d9b3d6)','Hitam Putih':'linear-gradient(135deg,#eee,#333)'};
Object.keys(LOOKS).forEach(k=>{const e=document.createElement('button');e.className='sw'+(k===filt?' on':'');e.innerHTML='<i style="background:'+SWC[k]+'"></i>'+k;
 e.onclick=()=>{filt=k;[...$('filters').children].forEach(x=>x.classList.toggle('on',x===e))};$('filters').appendChild(e)});

function render(){
 const f=FRAMES[frame],[bx,by,bw,bh]=f.box,L=LOOKS[filt],S=FULL?1:.5;
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7F4F6A');g.addColorStop(1,'#452B48');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 f.bg&&f.bg();
 const src=still||(v.readyState>=2?v:null);
 ctx.save();if(f.path){f.path();ctx.clip()}
 if(src){
  const sw0=still?still.naturalWidth:v.videoWidth,sh0=still?still.naturalHeight:v.videoHeight,t=bw/bh;
  let sw=sw0,sh=sw0/t;if(sh>sh0){sh=sh0;sw=sh0*t}
  const ow=Math.round(bw*S),oh=Math.round(bh*S);
  if(oc.width!==ow||oc.height!==oh){oc.width=ow;oc.height=oh}
  octx.save();if(mirror&&!still){octx.translate(ow,0);octx.scale(-1,1)}
  octx.drawImage(src,(sw0-sw)/2,(sh0-sh)/2,sw,sh,0,0,ow,oh);octx.restore();
  if(L)grade(L,ow,oh);
  if(L&&L.vig){const r=octx.createRadialGradient(ow/2,oh/2,oh*.3,ow/2,oh/2,oh*.75);r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,'rgba(0,0,0,'+L.vig+')');octx.fillStyle=r;octx.fillRect(0,0,ow,oh)}
  if(f.mask&&f.mask.naturalWidth){octx.globalCompositeOperation='destination-in';octx.drawImage(f.mask,(f.x-bx)*S,(f.y-by)*S,f.w*S,f.h*S);octx.globalCompositeOperation='source-over'}
  ctx.drawImage(oc,bx,by,bw,bh);
 }else if(!f.mask){ctx.fillStyle='#000';ctx.fillRect(bx,by,bw,bh)}
 ctx.restore();
 if(f.img&&f.img.naturalWidth)ctx.drawImage(f.img,f.x,f.y,f.w,f.h);
 f.deco&&f.deco();
}
function loop(){if(!cam.classList.contains('on'))return;render();requestAnimationFrame(loop)}

// ----- camera
let starting=false,mirror=true;
async function startCam(){
 if(starting)return;starting=true;stopCam();
 try{
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:facing},width:{ideal:1280},height:{ideal:1280}},audio:false})}
  catch(e){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false})}
  const fm=stream.getVideoTracks()[0].getSettings().facingMode;
  mirror=fm?fm==='user':facing==='user';
  v.srcObject=stream;await v.play();
 }catch(e){alert("Kamera tidak dapat dibuka: "+e.message)}
 starting=false;
}
function stopCam(){stream&&stream.getTracks().forEach(t=>t.stop());stream=null}
async function openCam(){still=null;show('cam');await document.fonts.load("40px 'Great Vibes'");await startCam();loop()}
function closeCam(){stopCam();show('home')}
function flip(){if(starting)return;facing=facing==='user'?'environment':'user';still=null;startCam()}
// iOS pauses the camera when you leave the tab/app: restart it when you come back
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cam.classList.contains('on')&&!still)startCam()});
$('pick').onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>still=i;i.src=URL.createObjectURL(f);e.target.value=''};

function snap(){
 FULL=true;render();const url=c.toDataURL('image/jpeg',.88);FULL=false;
 photos.unshift({url,by:$('guest').value.trim()||'Tetamu'});
 $('rimg').src=url;$('dl').href=url;res.classList.add('on');
}
function renderAlbum(){
 const g=$('grid');g.innerHTML='';
 if(!photos.length){g.innerHTML='<div style="grid-column:1/3;text-align:center;margin-top:60px;font-size:22px;font-style:italic">Belum ada gambar &mdash; jadilah yang pertama!</div>';return}
 photos.forEach(p=>{const d=document.createElement('div');d.className='card';d.innerHTML='<img src="'+p.url+'"><div class="script" style="font-size:26px"></div>';d.lastChild.textContent=p.by;g.appendChild(d)})
}
</script>
</body>
</html>
